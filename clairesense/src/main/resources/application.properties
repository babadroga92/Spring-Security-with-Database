spring.application.name=clairesense
spring.ai.ollama.chat.options.model=gemma3:4b
spring.ai.ollama.embedding.enabled=true
spring.ai.ollama.embedding.options.model=nomic-embed-text

spring.datasource.url=jdbc:postgresql://localhost:5432/clairesense
spring.datasource.username=clairesense_user
spring.datasource.password=clairesense_pass
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
